<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HomeSync - Contact</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="page">

		<aside class="sidebar">
			<div class="logo-title">HomeSync</div>
			<nav class="nav-menu">
				<a class="nav-item" href="index.html">🏠 Dashboard</a>
				<a class="nav-item" href="devices.html">💡 Devices</a>
				<a class="nav-item" href="rooms.html">🚪 Rooms</a>
				<a class="nav-item" href="settings.html">⚙️ Settings</a>
				<a class="nav-item active" href="contact.html">✉️ Contact</a>
			</nav>
		</aside>

		<main class="main-content">
			<h1 class="welcome-title">Contact Us</h1>

			<div class="contact-grid">

				<div class="settings-card">
					<h3 class="settings-group-title">Send a message</h3>
					<input class="field" id="name" placeholder="Full name">
					<input class="field" id="email" type="email" placeholder="Email">
					<textarea class="field" id="message" placeholder="Write your message"></textarea>
					<button class="save-btn" onclick="sendMessage()">Send</button>
				</div>

				<div class="settings-card">
					<h3 class="settings-group-title">Contact info</h3>
					<p>📧 support@homesync.com</p>
					<br>
					<p>📞 +91 98765 43210</p>
				</div>
			</div>
		</main>
	</div>

	<script>
		function sendMessage() {
			const name = document.getElementById("name").value.trim();
			const email = document.getElementById("email").value.trim();
			const message = document.getElementById("message").value.trim();

			if (name === "") {
				alert("Please enter your name.");
			} else if (!email.includes("@") || !email.includes(".")) {
				alert("Please enter a valid email.");
			} else if (message.length < 10) {
				alert("Message must be at least 10 characters.");
			} else {
				alert("Message sent! We will reply soon.");
				document.getElementById("message").value = "";
			}
		}

		// Fill name and email if saved in settings
		document.getElementById("name").value = localStorage.getItem("name") || "";
		document.getElementById("email").value = localStorage.getItem("email") || "";

		// Dark mode
		document.body.classList.toggle("dark", localStorage.getItem("dark") === "true");
	</script>
</body>
</html>
